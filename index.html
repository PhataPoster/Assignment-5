<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Issue Tracker</title>
    <link rel="shortcut icon"
        href="./B13-A5-Github-Issue-Tracker-main/B13-A5-Github-Issue-Tracker-main/assets/github-brands-solid-full.svg"
        type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="geist-font min-h-screen flex items-center justify-center bg-gray-100">
    <fieldset class="fieldset bg-white border-base-300 rounded-box w-[520px] border p-8 mx-auto shadow-lg">
        <div class="flex flex-col justify-center items-center gap-1">
            <img class="mb-3 w-25 h-25"
                src="./B13-A5-Github-Issue-Tracker-main/B13-A5-Github-Issue-Tracker-main/assets/github-logo.png" alt="">

            <h1 class="font-bold text-2xl">Github Issue Tracker</h1>
            <p class="font-semibold text-gray-500 text-sm">Sign in to manage your issues</p>
        </div>

        <label class="label text-lg font-semibold mt-3 ">Username</label>
        <input type="text" id="user-name" class="input font-semibold w-full" placeholder="Username" />
        <p class="text-blue-600">Default: admin</p>

        <label class="label text-lg font-semibold">Password</label>
        <input type="password" id="password" class="input font-semibold w-full" placeholder="Password" />
        <p class="text-blue-600">Default: admin123</p>

        <button id="signin-btn"
            class="btn btn-neutral bg-blue-700 text-white my-2 border-0 rounded-lg text-sm shadow-sm shadow-blue-600">Sign
            In</button>

        <div class="flex items-center gap-2 my-3">
            <div class="flex-1 h-px bg-gray-300"></div>
            <span class="text-gray-500 text-lg font-bold">OR</span>
            <div class="flex-1 h-px bg-gray-300"></div>
        </div>
        <p class="text-sm font-semibold text-gray-500 text-center">Demo credentials:</p>
        <div class=" bg-gray-100 p-4 rounded-lg text-center">
            <p class=""><span class="font-bold ">Username:</span> admin</p>
            <p class=""><span class="font-bold ">Password:</span> admin123</p>
        </div>
    </fieldset>

    <script src="./scripts/login.js"></script>
</body>

</html>
