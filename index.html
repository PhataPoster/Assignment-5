<body class="geist-font bg-gray-100 min-h-screen">
    <header>
        <nav>
            <div class="navbar bg-white flex shadow-sm  justify-between px-20 flex-col gap-4 py-4 md:flex-row">
                <div class="flex items-center justify-center">
                    <img class="w-9 h-9"
                        src="./B13-A5-Github-Issue-Tracker-main/B13-A5-Github-Issue-Tracker-main/assets/github-logo.png"
                        alt="">
                    <a class="btn btn-ghost text-xl" href="#">GitHub Issue Tracker</a>
                </div>
                <div class="flex gap-2">
                    <div><label class="input">
                            <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                                    stroke="currentColor">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.3-4.3"></path>
                                </g>
                            </svg>
                            <input type="search" required placeholder="Search issues..." />
                        </label></div>
                    <div>
                        <button class="btn 
                            btn-primary"><i class="fa-solid fa-plus"></i>New Issue</button>
                    </div>
                </div>
            </div>
        </nav>

    </header>
    <main class="max-w-[1300px] mx-auto mt-15 px-2 shadow-lg">
        <section class="flex gap-2 bg-white py-2 px-6 rounded-md shadow-md mb-4">
            <button onclick=" toggleActiveButton('all-issues-btn')" id="all-issues-btn" class="btn border border-gray-300 bg-blue-700 text-white">All</button>
            <button onclick=" toggleActiveButton('open-issues-btn')" id="open-issues-btn" class="btn border border-gray-300 ">Open</button>
            <button onclick=" toggleActiveButton('closed-issues-btn')" id="closed-issues-btn" class="btn border border-gray-300">Closed</button>
        </section>

        <section class="flex justify-between items-center px-6 py-6 bg-white rounded-md shadow-md">
            <div class=" flex justify-center items-center gap-2">
                <img src="./B13-A5-Github-Issue-Tracker-main/B13-A5-Github-Issue-Tracker-main/assets/Aperture.png"
                    alt="Aperture" class=" border-8 border-purple-200 rounded-full bg-purple-200">

                <div class="">
                    <h2 class="text-2xl font-semibold"><span id="issues-length">50</span> Issues</h2>
                    <p class="text-sm text-gray-400 ">Track and manage your project issues</p>
                </div>
            </div>
            <div class="flex items-center gap-4">

                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-green-500 rounded-full"></span>
                    <span class="font-semibold">Open</span>
                </div>

                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                    <span class="font-semibold">Closed</span>
                </div>

            </div>
        </section>
        <section id="issues-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 m-6">
